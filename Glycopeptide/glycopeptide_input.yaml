sxm_file: 'glycopeptide.sxm'  
circle_input_path: '210204_Cu100_028_nanonis_positions.csv'
stm_grid_path: '210204_Cu100_028_nanonis_positions.npz'

sugars:
  Glc: 'C([C@@H]1[C@H]([C@@H]([C@H](C(O1)O)O)O)O)O'

experimental_positions:
  Glc: [0, 1]

conformer_parameters:
  num_conformers: 20
  max_keep: 3

conformer_selection:
  strategy: 'lowest_energy'

root_mol: 'Glc_0'

direction:
  - ['Glc_0', 'C1', 'Glc_1', 'C4']
  - ['Glc_1', 'C6', [7]]

peptide:
  sequence: 'A-F-N'  
  residues:
    - aa: 'Asn'      
      ca_position: 2
      functional_position: null
    - aa: 'Phe'      
      ca_position: 5
      functional_position: 4
    - aa: 'Ala'      
      ca_position: 6
      functional_position: null

peptide_bonds:
  - sugar_mol: 'Glc_1'
    sugar_carbon: 'C1'
    aa_type: 'Asn'
    residue_index: 2
    glycosylation_type: 'N-glycosidic'
    anomeric_config: 'beta'
    use_spacer: false

glycosidic_bonds:
  - ['Glc_0', 'C1', 'Glc_1', 'C4', 'beta', 'Glc-Glc beta(1-4)']
